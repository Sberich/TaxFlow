<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer App Icon Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Minimal Document Base -->
    <rect x="146" y="110" width="220" height="292" rx="36" fill="#ffffff"/>
    
    <!-- Document Header / Graph -->
    <rect x="186" y="150" width="140" height="48" rx="16" fill="#eff6ff"/>
    
    <!-- Text Lines -->
    <rect x="186" y="234" width="140" height="16" rx="8" fill="#dbeafe"/>
    <rect x="186" y="274" width="100" height="16" rx="8" fill="#dbeafe"/>
    
    <!-- Bold Checkmark to signify completion/success -->
    <path d="M 230,330 L 260,355 L 325,280" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
