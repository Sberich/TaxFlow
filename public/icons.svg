<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Vertical bar of T (Massive) -->
    <rect x="230" y="120" width="52" height="240" rx="26" fill="url(#accent)"/>
    <!-- Horizontal bar of T (Massive) -->
    <rect x="120" y="120" width="272" height="52" rx="26" fill="url(#accent)"/>
    
    <!-- The Flow (Non-overlapping, swooping under and up to the right) -->
    <path d="M 100 340 C 140 440, 360 460, 420 280" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/>
    
    <!-- The Glowing Accent Dot (Money / Growth) -->
    <circle cx="420" cy="280" r="22" fill="#e0f2fe"/>
  </g>
</svg>